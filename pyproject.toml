[project]
name = "policycheck"
version = "0.1.0"
description = "Commercial package policy comparison — expiring vs renewal"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pypdfium2>=4.30",
    "pikepdf>=9.0",
    "reportlab>=4.2",
    "pillow>=11.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[project.scripts]
pc = "policycheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policycheck"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Prose in docstrings uses en dashes and typographic quotes deliberately.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call-expression defaults; B008 is the whole idiom.
"src/policycheck/cli.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
